<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:rgba(13,8,33,.88);color:#fff;font-family:Segoe UI,sans-serif;display:grid;place-items:center;height:100vh;backdrop-filter:blur(12px)}#keys{display:grid;grid-template-columns:repeat(12,1fr);gap:9px;width:92%}.key{padding:15px 5px;text-align:center;background:#2c2050;border:1px solid #7258a8;border-radius:10px;font-weight:700}.down{background:#76efc5;color:#10233b;box-shadow:0 0 18px #76efc5}.wide{grid-column:span 3}</style></head><body><div id="keys"></div><script>const {ipcRenderer}=require('electron');const keys=['Esc','1','2','3','4','5','6','7','8','9','0','Backspace','Tab','q','w','e','r','t','y','u','i','o','p','Enter','a','s','d','f','g','h','j','k','l','Shift','z','x','c','v','b','n','m','Space','←','↓','↑','→'];const map={Escape:'Esc',' ':'Space',ArrowLeft:'←',ArrowDown:'↓',ArrowUp:'↑',ArrowRight:'→'};const box=document.getElementById('keys');for(const key of keys){const el=document.createElement('div');el.className='key'+(['Space','Backspace','Enter','Shift'].includes(key)?' wide':'');el.dataset.key=key;el.textContent=key;box.append(el)}ipcRenderer.on('desklink-key-state',(_event,message)=>{if(message.type==='release-input'){document.querySelectorAll('.down').forEach(el=>el.classList.remove('down'));return}const key=map[message.payload?.key]||message.payload?.key;document.querySelectorAll(`[data-key="${key}"]`).forEach(el=>el.classList.toggle('down',message.type==='key-down'))});</script></body></html>
